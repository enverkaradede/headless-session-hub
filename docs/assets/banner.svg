<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Session Hub — a lighthouse for your headless Claude Code sessions">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A35"/>
      <stop offset="1" stop-color="#041016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.27" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#FFA95C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFA95C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.1" r="0.45">
      <stop offset="0" stop-color="#2C6C80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2C6C80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE1BD" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFC58A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBack" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFC58A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC58A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE1BD"/>
      <stop offset="1" stop-color="#F08A3A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE1BD"/>
      <stop offset="1" stop-color="#FFA95C"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#sky)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="27.5" fill="none" stroke="#FFC58A" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- stars -->
  <g fill="#FFE1BD">
    <circle cx="612" cy="58" r="1.6" opacity="0.5"/>
    <circle cx="760" cy="96" r="1.2" opacity="0.35"/>
    <circle cx="1040" cy="64" r="1.6" opacity="0.45"/>
    <circle cx="1188" cy="150" r="1.2" opacity="0.3"/>
    <circle cx="96" cy="70" r="1.4" opacity="0.35"/>
    <circle cx="904" cy="40" r="1.1" opacity="0.4"/>
  </g>

  <!-- sweeping beam -->
  <g transform="translate(330 150)">
    <path d="M0 -6 L270 -70 L270 70 L0 6 Z" fill="url(#beam)" opacity="0.55">
      <animateTransform attributeName="transform" type="scale" values="1 1; 1 0.55; 1 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.25;0.55" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -6 L-210 -60 L-210 60 L0 6 Z" fill="url(#beamBack)"/>
  </g>

  <!-- lighthouse -->
  <g transform="translate(330 0)">
    <rect x="-36" y="118" width="72" height="66" rx="20" fill="url(#tower)"/>
    <circle cx="0" cy="150" r="54" fill="#FFA95C" opacity="0.16">
      <animate attributeName="r" values="46;60;46" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.20;0.08;0.20" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M-44 196 H44 L66 330 H-66 Z" fill="url(#tower)"/>
    <path d="M-50 258 H50" stroke="#041016" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- sea -->
  <path d="M120 352 C 210 326, 270 326, 350 352 S 500 378, 590 352" fill="none" stroke="#7FB6C7" stroke-opacity="0.7" stroke-width="12" stroke-linecap="round"/>
  <path d="M170 384 C 240 366, 300 366, 360 384 S 470 402, 540 384" fill="none" stroke="#4A8EA3" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="640" y="176" font-size="76" font-weight="700" fill="url(#title)" letter-spacing="-1.5">Session Hub</text>
    <text x="642" y="226" font-size="26" fill="#E7F1F4" opacity="0.92">A lighthouse for your headless Claude Code sessions.</text>
    <text x="642" y="264" font-size="19" fill="#7FB6C7">Questions and permissions reach you, on every device you own.</text>
    <g transform="translate(642 300)" font-size="15" font-weight="600">
      <rect width="118" height="34" rx="17" fill="#FFA95C" fill-opacity="0.12" stroke="#FFA95C" stroke-opacity="0.35"/>
      <text x="59" y="22" text-anchor="middle" fill="#FFC58A">macOS</text>
      <rect x="130" width="124" height="34" rx="17" fill="#FFA95C" fill-opacity="0.12" stroke="#FFA95C" stroke-opacity="0.35"/>
      <text x="192" y="22" text-anchor="middle" fill="#FFC58A">Windows</text>
      <rect x="266" width="150" height="34" rx="17" fill="#7FB6C7" fill-opacity="0.10" stroke="#7FB6C7" stroke-opacity="0.35"/>
      <text x="341" y="22" text-anchor="middle" fill="#BFE0EA">Peer-to-peer</text>
    </g>
  </g>
</svg>
